name: Formal tools SEO checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3
      - run: python scripts/seo_check.py
