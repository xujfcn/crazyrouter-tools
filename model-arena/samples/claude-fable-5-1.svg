<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3f6"/>
      <stop offset="0.7" stop-color="#a9dcff"/>
      <stop offset="1" stop-color="#fff1c2"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bdcf4"/>
      <stop offset="1" stop-color="#2f8fd0"/>
    </linearGradient>
    <radialGradient id="bodyg" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ea"/>
    </radialGradient>
    <clipPath id="lakeclip"><rect x="0" y="272" width="800" height="92"/></clipPath>

    <g id="wheel">
      <circle r="55" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="49" fill="none" stroke="#cfd6dc" stroke-width="3"/>
      <g stroke="#9aa5ad" stroke-width="2">
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(30)"/>
        <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(60)"/>
        <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(90)"/>
        <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(120)"/>
        <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(150)"/>
      </g>
      <circle r="6" fill="#555"/>
    </g>

    <g id="blade">
      <line x1="0" y1="0" x2="0" y2="-72" stroke="#5a3a22" stroke-width="3"/>
      <rect x="1.5" y="-70" width="11" height="54" fill="#fdf6e3" stroke="#5a3a22" stroke-width="1.5"/>
      <line x1="1.5" y1="-56" x2="12.5" y2="-56" stroke="#5a3a22" stroke-width="1"/>
      <line x1="1.5" y1="-42" x2="12.5" y2="-42" stroke="#5a3a22" stroke-width="1"/>
      <line x1="1.5" y1="-28" x2="12.5" y2="-28" stroke="#5a3a22" stroke-width="1"/>
    </g>

    <g id="windmill">
      <path d="M620,272 L680,272 L669,165 L631,165 Z" fill="#e0a86b" stroke="#8a5a30" stroke-width="2"/>
      <line x1="627" y1="205" x2="673" y2="205" stroke="#8a5a30" stroke-width="2"/>
      <rect x="641" y="240" width="18" height="32" rx="9" fill="#6b3e22"/>
      <rect x="643" y="183" width="14" height="14" fill="#8fd3ff" stroke="#8a5a30" stroke-width="1.5"/>
      <path d="M626,167 Q650,138 674,167 Z" fill="#c0392b" stroke="#7a2418" stroke-width="2"/>
      <g transform="translate(650,158)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
          <use xlink:href="#blade"/>
          <use xlink:href="#blade" transform="rotate(90)"/>
          <use xlink:href="#blade" transform="rotate(180)"/>
          <use xlink:href="#blade" transform="rotate(270)"/>
        </g>
        <circle r="5" fill="#3b2314"/>
      </g>
    </g>

    <g id="cloud" fill="#ffffff" opacity="0.92">
      <ellipse cx="0" cy="0" rx="34" ry="16"/>
      <ellipse cx="-22" cy="6" rx="22" ry="12"/>
      <ellipse cx="24" cy="6" rx="24" ry="13"/>
      <ellipse cx="4" cy="-10" rx="20" ry="14"/>
    </g>

    <g id="tuft" fill="none" stroke="#3e9a3e" stroke-width="3" stroke-linecap="round">
      <path d="M0,0 C-3,-8 -8,-12 -10,-18"/>
      <path d="M0,0 C0,-10 2,-16 1,-22"/>
      <path d="M0,0 C4,-8 9,-12 11,-17"/>
    </g>

    <g id="reed">
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#4a8a3a" stroke-width="3"/>
      <ellipse cx="0" cy="-48" rx="3.5" ry="9" fill="#7a4a24"/>
    </g>

    <g id="tree">
      <line x1="0" y1="0" x2="0" y2="-10" stroke="#6b4a2a" stroke-width="3"/>
      <circle cx="0" cy="-16" r="10" fill="#3f8f3f"/>
    </g>

    <path id="foot" d="M-9,-4 L5,-8 L19,-5 L22,0 L17,1 L21,5 L14,3 L9,6 L4,3 L-9,2 Z" stroke="#b86a12" stroke-width="1" stroke-linejoin="round"/>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="690" cy="80" r="52" fill="#fff2a8" opacity="0.45"/>
  <g transform="translate(690,80)" stroke="#ffe680" stroke-width="4" opacity="0.75" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 690 80" to="360 690 80" dur="40s" repeatCount="indefinite" additive="sum"/>
    <line x1="0" y1="-42" x2="0" y2="-58"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(30)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(60)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(90)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(120)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(150)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(180)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(210)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(240)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(270)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(300)"/>
    <line x1="0" y1="-42" x2="0" y2="-58" transform="rotate(330)"/>
  </g>
  <circle cx="690" cy="80" r="36" fill="#ffd93d"/>

  <!-- Clouds -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="60s" repeatCount="indefinite"/>
    <g>
      <use xlink:href="#cloud" transform="translate(110,80)"/>
      <use xlink:href="#cloud" transform="translate(380,120) scale(0.8)"/>
      <use xlink:href="#cloud" transform="translate(560,60) scale(0.7)"/>
    </g>
    <g transform="translate(800,0)">
      <use xlink:href="#cloud" transform="translate(110,80)"/>
      <use xlink:href="#cloud" transform="translate(380,120) scale(0.8)"/>
      <use xlink:href="#cloud" transform="translate(560,60) scale(0.7)"/>
    </g>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#3a4a5a" stroke-width="1.5">
    <path d="M0,0 q6,-6 12,0 q6,-6 12,0">
      <animateTransform attributeName="transform" type="translate" from="840 130" to="-60 110" dur="28s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 q5,-5 10,0 q5,-5 10,0">
      <animateTransform attributeName="transform" type="translate" from="840 160" to="-60 150" dur="34s" begin="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Far hills -->
  <path d="M0,280 L0,250 Q60,225 130,248 Q200,222 270,246 Q340,232 400,252 Q460,230 520,250 Q600,236 660,255 Q730,238 800,252 L800,280 Z" fill="#8fcf7f"/>
  <!-- Far bank -->
  <path d="M0,274 L0,266 Q400,258 800,266 L800,274 Z" fill="#62b356"/>
  <use xlink:href="#tree" transform="translate(70,272)"/>
  <use xlink:href="#tree" transform="translate(98,272) scale(0.8)"/>
  <use xlink:href="#tree" transform="translate(150,272) scale(0.9)"/>
  <use xlink:href="#tree" transform="translate(500,272) scale(0.85)"/>
  <use xlink:href="#tree" transform="translate(545,272)"/>
  <use xlink:href="#tree" transform="translate(740,272) scale(0.9)"/>

  <!-- Windmill -->
  <use xlink:href="#windmill"/>

  <!-- Lake -->
  <rect x="0" y="272" width="800" height="110" fill="url(#lake)"/>
  <g clip-path="url(#lakeclip)">
    <use xlink:href="#windmill" transform="translate(0,544) scale(1,-1)" opacity="0.35">
      <animate attributeName="opacity" values="0.3;0.42;0.3" dur="3s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="4s" repeatCount="indefinite"/>
    <path d="M60,300 q15,-4 30,0 t30,0 t30,0"/>
    <path d="M260,322 q15,-4 30,0 t30,0"/>
    <path d="M420,296 q15,-4 30,0 t30,0 t30,0"/>
    <path d="M140,345 q15,-4 30,0 t30,0"/>
    <path d="M560,335 q15,-4 30,0 t30,0 t30,0"/>
    <path d="M700,305 q15,-4 30,0 t30,0"/>
  </g>
  <ellipse cx="690" cy="300" rx="40" ry="4" fill="#fff6c8" opacity="0.5">
    <animate attributeName="rx" values="40;52;40" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Near bank -->
  <path d="M0,368 Q100,358 200,366 Q300,374 400,364 Q500,356 600,366 Q700,374 800,362 L800,420 L0,420 Z" fill="#6cc25a"/>
  <!-- Reeds (parallax scroll) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="3.6s" repeatCount="indefinite"/>
    <g>
      <use xlink:href="#reed" transform="translate(30,374)"/>
      <use xlink:href="#reed" transform="translate(46,377) scale(0.85)"/>
      <use xlink:href="#reed" transform="translate(150,372)"/>
      <use xlink:href="#reed" transform="translate(320,376) scale(0.9)"/>
      <use xlink:href="#reed" transform="translate(338,373)"/>
      <use xlink:href="#reed" transform="translate(530,374)"/>
      <use xlink:href="#reed" transform="translate(680,378) scale(0.9)"/>
      <use xlink:href="#reed" transform="translate(697,373)"/>
    </g>
    <g transform="translate(800,0)">
      <use xlink:href="#reed" transform="translate(30,374)"/>
      <use xlink:href="#reed" transform="translate(46,377) scale(0.85)"/>
      <use xlink:href="#reed" transform="translate(150,372)"/>
      <use xlink:href="#reed" transform="translate(320,376) scale(0.9)"/>
      <use xlink:href="#reed" transform="translate(338,373)"/>
      <use xlink:href="#reed" transform="translate(530,374)"/>
      <use xlink:href="#reed" transform="translate(680,378) scale(0.9)"/>
      <use xlink:href="#reed" transform="translate(697,373)"/>
    </g>
  </g>

  <!-- Path -->
  <rect x="0" y="415" width="800" height="42" fill="#e9cd8e"/>
  <line x1="0" y1="416" x2="800" y2="416" stroke="#d9b978" stroke-width="2"/>
  <line x1="0" y1="441" x2="800" y2="441" stroke="#d6b46f" stroke-width="4" stroke-dasharray="28 52" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.21s" repeatCount="indefinite"/>
  </line>

  <!-- Foreground grass -->
  <rect x="0" y="455" width="800" height="45" fill="#58b24a"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="2.1s" repeatCount="indefinite"/>
    <g>
      <use xlink:href="#tuft" transform="translate(40,482)"/>
      <use xlink:href="#tuft" transform="translate(130,494)"/>
      <use xlink:href="#tuft" transform="translate(260,480)"/>
      <use xlink:href="#tuft" transform="translate(350,496)"/>
      <use xlink:href="#tuft" transform="translate(470,484)"/>
      <use xlink:href="#tuft" transform="translate(590,497)"/>
      <use xlink:href="#tuft" transform="translate(700,481)"/>
      <use xlink:href="#tuft" transform="translate(760,494)"/>
    </g>
    <g transform="translate(800,0)">
      <use xlink:href="#tuft" transform="translate(40,482)"/>
      <use xlink:href="#tuft" transform="translate(130,494)"/>
      <use xlink:href="#tuft" transform="translate(260,480)"/>
      <use xlink:href="#tuft" transform="translate(350,496)"/>
      <use xlink:href="#tuft" transform="translate(470,484)"/>
      <use xlink:href="#tuft" transform="translate(590,497)"/>
      <use xlink:href="#tuft" transform="translate(700,481)"/>
      <use xlink:href="#tuft" transform="translate(760,494)"/>
    </g>
  </g>

  <!-- ===== Pelican on bicycle ===== -->
  <g>
    <!-- Far crank + pedal + foot -->
    <g transform="translate(340,375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="-22" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
        <g transform="translate(-22,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
            <rect x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#333"/>
            <use xlink:href="#foot" fill="#d4831d"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Far leg -->
    <path fill="none" stroke="#d4831d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M302,290 L350.9,324.8 L318,375">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M302,290 L350.9,324.8 L318,375;                 M302,290 L358.5,310.1 L324.4,359.4;                 M302,290 L361.6,297 L340,353;                 M302,290 L361.2,299.7 L355.6,359.4;                 M302,290 L356.4,315.3 L362,375;                 M302,290 L345.4,331.4 L355.6,390.6;                 M302,290 L339.4,337 L340,397;                 M302,290 L343.2,333.6 L324.4,390.6;                 M302,290 L350.9,324.8 L318,375"/>
    </path>

    <!-- Wheels -->
    <g transform="translate(250,380)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <use xlink:href="#wheel"/>
      </g>
    </g>
    <g transform="translate(450,380)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <use xlink:href="#wheel"/>
      </g>
    </g>

    <!-- Frame -->
    <g stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M340,375 L300,287 L440,300 Z"/>
      <path d="M340,375 L250,380 L300,287"/>
      <path d="M440,300 L450,380"/>
    </g>
    <!-- Handlebar -->
    <path d="M440,300 L436,286 Q428,278 416,284" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <circle cx="416" cy="284" r="4.5" fill="#222"/>
    <!-- Chain -->
    <path d="M340,361 L250,373 A7,7 0 0 0 250,387 L340,389 A14,14 0 0 0 340,361 Z" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="0" to="7" dur="0.12s" repeatCount="indefinite"/>
    </path>
    <circle cx="250" cy="380" r="7" fill="#444"/>
    <circle cx="340" cy="375" r="14" fill="#444" stroke="#222" stroke-width="1.5"/>
    <circle cx="340" cy="375" r="5" fill="#999"/>
    <!-- Seat -->
    <line x1="300" y1="287" x2="303" y2="298" stroke="#333" stroke-width="4"/>
    <path d="M282,286 Q300,276 318,287 Q300,293 282,286 Z" fill="#333"/>

    <!-- Back wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 320 258;6 320 258;-5 320 258" dur="1.2s" repeatCount="indefinite"/>
      <path d="M320,258 C292,252 258,232 234,204 C238,240 262,266 302,272 Z" fill="#f2f4f6" stroke="#c4c9ce" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M300,268 L262,244 M296,270 L250,222" fill="none" stroke="#d5d9dd" stroke-width="1"/>
    </g>

    <!-- Tail -->
    <path d="M272,272 L240,286 L254,288 L246,299 L274,286 Z" fill="#dfe3e7" stroke="#c4c9ce" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Body -->
    <ellipse cx="308" cy="262" rx="44" ry="30" transform="rotate(-12 308 262)" fill="url(#bodyg)" stroke="#cfd3d8" stroke-width="1.5"/>

    <!-- Neck + head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 335 248;2 335 248;-2 335 248" dur="1.2s" repeatCount="indefinite"/>
      <path d="M330,250 C348,238 342,210 360,194" fill="none" stroke="#cfd3d8" stroke-width="24" stroke-linecap="round"/>
      <path d="M330,250 C348,238 342,210 360,194" fill="none" stroke="#ffffff" stroke-width="21" stroke-linecap="round"/>
      <circle cx="366" cy="187" r="21" fill="#ffffff" stroke="#cfd3d8" stroke-width="1.5"/>
      <path d="M352,170 Q346,158 356,162 Q354,150 364,157 L366,168 Z" fill="#f4f4f4" stroke="#c4c9ce" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Beak -->
      <path d="M381,193 Q398,228 452,203 L457,198 L381,192 Z" fill="#ffb347" stroke="#d66d0a" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M382,178 L458,197 L381,193 Z" fill="#ff8f1f" stroke="#d66d0a" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="383" y1="192.5" x2="455" y2="198" stroke="#d66d0a" stroke-width="1"/>
      <!-- Eye -->
      <circle cx="374" cy="181" r="4.5" fill="#222"/>
      <circle cx="375.6" cy="179.4" r="1.6" fill="#fff"/>
      <!-- Cheek -->
      <circle cx="362" cy="196" r="4" fill="#ffc9c9" opacity="0.7"/>
    </g>

    <!-- Front wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 318 262;-5 318 262;4 318 262" dur="1.2s" repeatCount="indefinite"/>
      <path d="M318,262 C340,252 372,238 404,230 C392,258 362,278 324,278 Z" fill="#ffffff" stroke="#c4c9ce" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M330,272 L370,248 M340,276 L392,244" fill="none" stroke="#d5d9dd" stroke-width="1"/>
    </g>

    <!-- Near leg -->
    <path fill="none" stroke="#f39c2b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M302,290 L356.4,315.3 L362,375">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M302,290 L356.4,315.3 L362,375;                 M302,290 L345.4,331.4 L355.6,390.6;                 M302,290 L339.4,337 L340,397;                 M302,290 L343.2,333.6 L324.4,390.6;                 M302,290 L350.9,324.8 L318,375;                 M302,290 L358.5,310.1 L324.4,359.4;                 M302,290 L361.6,297 L340,353;                 M302,290 L361.2,299.7 L355.6,359.4;                 M302,290 L356.4,315.3 L362,375"/>
    </path>

    <!-- Near crank + pedal + foot -->
    <g transform="translate(340,375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="22" y2="0" stroke="#666" stroke-width="5" stroke-linecap="round"/>
        <g transform="translate(22,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
            <rect x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#333"/>
            <use xlink:href="#foot" fill="#f39c2b"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Verification code -->
  <rect x="706" y="470" width="88" height="24" rx="6" fill="#ffffff" opacity="0.85"/>
  <text x="790" y="488" text-anchor="end" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b3a5c" letter-spacing="1">RBPKKA</text>
</svg>
