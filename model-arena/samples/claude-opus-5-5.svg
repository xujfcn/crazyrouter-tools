<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>鹈鹕骑自行车 · 湖畔风车</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec2ff"/>
      <stop offset="1" stop-color="#e2f6ff"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd3f7"/>
      <stop offset="1" stop-color="#1e88c8"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ccc3f"/>
      <stop offset="1" stop-color="#5a9e2c"/>
    </linearGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#fff9c4"/>
      <stop offset="1" stop-color="#ffd54f"/>
    </radialGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="42" ry="20" fill="#fff"/>
      <ellipse cx="-28" cy="6" rx="28" ry="15" fill="#fff"/>
      <ellipse cx="30" cy="6" rx="30" ry="15" fill="#fff"/>
      <ellipse cx="4" cy="-14" rx="24" ry="18" fill="#fff"/>
    </g>
    <g id="blade">
      <line x1="130" y1="212" x2="130" y2="128" stroke="#6d4c41" stroke-width="4"/>
      <rect x="132" y="130" width="16" height="70" fill="#fff8e1" stroke="#6d4c41" stroke-width="2"/>
      <line x1="140" y1="130" x2="140" y2="200" stroke="#a1887f" stroke-width="1.5"/>
      <line x1="132" y1="148" x2="148" y2="148" stroke="#a1887f" stroke-width="1.5"/>
      <line x1="132" y1="165" x2="148" y2="165" stroke="#a1887f" stroke-width="1.5"/>
      <line x1="132" y1="182" x2="148" y2="182" stroke="#a1887f" stroke-width="1.5"/>
    </g>
    <g id="windmill">
      <path d="M105,340 L155,340 L147,225 L113,225 Z" fill="#f7e3bd" stroke="#8d6e63" stroke-width="3"/>
      <path d="M121,340 L121,318 Q130,306 139,318 L139,340 Z" fill="#8d4f2a"/>
      <rect x="123" y="262" width="14" height="16" rx="3" fill="#4fc3f7" stroke="#8d6e63" stroke-width="2"/>
      <rect x="100" y="292" width="60" height="5" fill="#8d6e63"/>
      <path d="M106,229 Q130,188 154,229 Z" fill="#e64a19" stroke="#8d3a1a" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 130 212" to="360 130 212" dur="7s" repeatCount="indefinite"/>
        <use href="#blade"/>
        <use href="#blade" transform="rotate(90 130 212)"/>
        <use href="#blade" transform="rotate(180 130 212)"/>
        <use href="#blade" transform="rotate(270 130 212)"/>
        <circle cx="130" cy="212" r="7" fill="#5d4037"/>
      </g>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <g>
    <g stroke="#ffe082" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 680 90" to="360 680 90" dur="20s" repeatCount="indefinite"/>
      <line x1="680" y1="30" x2="680" y2="42"/><line x1="680" y1="138" x2="680" y2="150"/>
      <line x1="620" y1="90" x2="632" y2="90"/><line x1="728" y1="90" x2="740" y2="90"/>
      <line x1="638" y1="48" x2="646" y2="56"/><line x1="714" y1="124" x2="722" y2="132"/>
      <line x1="722" y1="48" x2="714" y2="56"/><line x1="646" y1="124" x2="638" y2="132"/>
    </g>
    <circle cx="680" cy="90" r="38" fill="url(#sunG)"/>
  </g>

  <!-- Clouds -->
  <g opacity="0.95">
    <use href="#cloud" transform="translate(0,70)">
      <animateTransform attributeName="transform" type="translate" values="880,70;-120,70" dur="38s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" transform="translate(0,140) scale(0.7)">
      <animateTransform attributeName="transform" type="translate" values="500,140;-120,140;" dur="30s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" transform="translate(0,50)">
      <animateTransform attributeName="transform" type="translate" values="300,40;-120,40" dur="22s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Far hills -->
  <path d="M0,305 Q120,250 250,290 Q380,240 520,285 Q650,245 800,280 L800,320 L0,320 Z" fill="#8fd18a"/>
  <path d="M0,315 Q180,280 360,305 Q560,275 800,300 L800,325 L0,325 Z" fill="#6fbf6a"/>

  <!-- Lake -->
  <rect x="0" y="318" width="800" height="110" fill="url(#lake)"/>
  <use href="#windmill" transform="translate(0,510) scale(1,-0.5)" opacity="0.22"/>
  <g stroke="#e1f5fe" stroke-width="3" stroke-linecap="round">
    <line x1="260" y1="345" x2="300" y2="345"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="420" y1="360" x2="470" y2="360"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="600" y1="340" x2="640" y2="340"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></line>
    <line x1="690" y1="380" x2="740" y2="380"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="330" y1="390" x2="365" y2="390"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></line>
  </g>
  <!-- Lily pads -->
  <g>
    <ellipse cx="560" cy="398" rx="18" ry="6" fill="#43a047"/>
    <ellipse cx="590" cy="405" rx="12" ry="4" fill="#66bb6a"/>
    <circle cx="562" cy="394" r="4" fill="#f48fb1"/>
  </g>
  <!-- Little sailboat -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;30,-2;0,0" dur="9s" repeatCount="indefinite"/>
    <path d="M620,352 L670,352 L662,362 L628,362 Z" fill="#ef5350"/>
    <path d="M645,350 L645,312 L668,348 Z" fill="#fff"/>
    <path d="M642,350 L642,320 L626,348 Z" fill="#ffe082"/>
  </g>

  <!-- Windmill shore -->
  <ellipse cx="125" cy="343" rx="115" ry="18" fill="#7cb342"/>
  <use href="#windmill"/>
  <g>
    <circle cx="60" cy="338" r="4" fill="#ff5252"/><circle cx="75" cy="342" r="4" fill="#ffeb3b"/>
    <circle cx="180" cy="340" r="4" fill="#ff4081"/><circle cx="196" cy="344" r="4" fill="#ff9800"/>
    <circle cx="212" cy="339" r="4" fill="#e040fb"/>
  </g>

  <!-- Reeds -->
  <g stroke="#558b2f" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M700,425 Q698,395 704,375"/><path d="M712,425 Q714,392 708,368"/><path d="M724,425 Q728,400 734,382"/>
    <path d="M250,425 Q246,400 252,384"/><path d="M262,425 Q266,398 260,380"/>
  </g>
  <g fill="#795548">
    <ellipse cx="708" cy="372" rx="3" ry="9"/><ellipse cx="260" cy="384" rx="3" ry="8"/>
  </g>

  <!-- Meadow -->
  <path d="M0,418 Q200,405 400,420 T800,412 L800,600 L0,600 Z" fill="url(#grass)"/>

  <!-- Path -->
  <rect x="0" y="468" width="800" height="64" fill="#f2d49b"/>
  <rect x="0" y="466" width="800" height="5" fill="#d9b373"/>
  <rect x="0" y="529" width="800" height="5" fill="#d9b373"/>
  <g fill="#d4a862">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.34s" repeatCount="indefinite"/>
    <ellipse cx="20" cy="485" rx="7" ry="3"/><ellipse cx="60" cy="515" rx="9" ry="3"/>
    <ellipse cx="100" cy="485" rx="7" ry="3"/><ellipse cx="140" cy="515" rx="9" ry="3"/>
    <ellipse cx="180" cy="485" rx="7" ry="3"/><ellipse cx="220" cy="515" rx="9" ry="3"/>
    <ellipse cx="260" cy="485" rx="7" ry="3"/><ellipse cx="300" cy="515" rx="9" ry="3"/>
    <ellipse cx="340" cy="485" rx="7" ry="3"/><ellipse cx="380" cy="515" rx="9" ry="3"/>
    <ellipse cx="420" cy="485" rx="7" ry="3"/><ellipse cx="460" cy="515" rx="9" ry="3"/>
    <ellipse cx="500" cy="485" rx="7" ry="3"/><ellipse cx="540" cy="515" rx="9" ry="3"/>
    <ellipse cx="580" cy="485" rx="7" ry="3"/><ellipse cx="620" cy="515" rx="9" ry="3"/>
    <ellipse cx="660" cy="485" rx="7" ry="3"/><ellipse cx="700" cy="515" rx="9" ry="3"/>
    <ellipse cx="740" cy="485" rx="7" ry="3"/><ellipse cx="780" cy="515" rx="9" ry="3"/>
    <ellipse cx="820" cy="485" rx="7" ry="3"/><ellipse cx="860" cy="515" rx="9" ry="3"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="190" y1="380" x2="225" y2="380"><animate attributeName="x1" values="220;170" dur="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="200" y1="410" x2="240" y2="410"><animate attributeName="x1" values="230;180" dur="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.6s" repeatCount="indefinite"/></line>
    <line x1="215" y1="300" x2="250" y2="300"><animate attributeName="x1" values="245;195" dur="0.55s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.55s" repeatCount="indefinite"/></line>
  </g>

  <!-- ===== Bike + Pelican ===== -->
  <ellipse cx="400" cy="503" rx="150" ry="9" fill="#000" opacity="0.15"/>

  <!-- Rear wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 290 440" to="360 290 440" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="290" cy="440" r="60" fill="none" stroke="#263238" stroke-width="9"/>
    <circle cx="290" cy="440" r="54" fill="none" stroke="#cfd8dc" stroke-width="3"/>
    <g stroke="#90a4ae" stroke-width="2">
      <line x1="290" y1="386" x2="290" y2="494"/><line x1="236" y1="440" x2="344" y2="440"/>
      <line x1="252" y1="402" x2="328" y2="478"/><line x1="328" y1="402" x2="252" y2="478"/>
    </g>
    <circle cx="290" cy="392" r="4" fill="#ffca28"/>
    <circle cx="290" cy="440" r="7" fill="#546e7a"/>
  </g>
  <!-- Front wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 510 440" to="360 510 440" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="510" cy="440" r="60" fill="none" stroke="#263238" stroke-width="9"/>
    <circle cx="510" cy="440" r="54" fill="none" stroke="#cfd8dc" stroke-width="3"/>
    <g stroke="#90a4ae" stroke-width="2">
      <line x1="510" y1="386" x2="510" y2="494"/><line x1="456" y1="440" x2="564" y2="440"/>
      <line x1="472" y1="402" x2="548" y2="478"/><line x1="548" y1="402" x2="472" y2="478"/>
    </g>
    <circle cx="510" cy="392" r="4" fill="#ffca28"/>
    <circle cx="510" cy="440" r="7" fill="#546e7a"/>
  </g>

  <!-- Far leg (B) -->
  <polyline fill="none" stroke="#e65100" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="372,392 403.2,417 367,434">
    <animate attributeName="points" dur="1.6s" repeatCount="indefinite" values="372,392 403.2,417 367,434;372,392 408.8,407.7 370.8,420;372,392 411.1,383.4 381,409.8;372,392 403.1,366.8 395,406;372,392 405.4,369.9 409,409.8;372,392 410.5,381 419.3,420;372,392 411.9,395.6 423,434;372,392 407.9,409.6 419.3,448;372,392 401.6,419 409,458.3;372,392 398.3,422.1 395,462;372,392 398.3,422.2 381,458.3;372,392 399.9,420.6 370.8,448;372,392 403.2,417 367,434"/>
  </polyline>
  <g transform="translate(367,440)">
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" values="367,440;370.75,426;381,415.75;395,412;409,415.75;419.25,426;423,440;419.25,454;409,464.25;395,468;381,464.25;370.75,454;367,440"/>
    <rect x="-9" y="-1" width="18" height="5" rx="2" fill="#37474f"/>
    <path d="M-5,-7 L15,-4 L17,1 L-6,1 Z" fill="#e65100"/>
  </g>

  <!-- Chain -->
  <g stroke="#455a64" stroke-width="2.5" fill="none">
    <line x1="395" y1="424" x2="290" y2="433"/>
    <line x1="395" y1="456" x2="290" y2="447"/>
    <circle cx="290" cy="440" r="7"/>
  </g>

  <!-- Frame -->
  <g stroke="#ff4f7b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="290" y1="440" x2="395" y2="440"/>
    <line x1="290" y1="440" x2="368" y2="364"/>
    <line x1="395" y1="440" x2="366" y2="356"/>
    <line x1="368" y1="362" x2="476" y2="348"/>
    <line x1="395" y1="440" x2="480" y2="364"/>
    <line x1="474" y1="338" x2="482" y2="368"/>
  </g>
  <line x1="480" y1="360" x2="510" y2="440" stroke="#d81b60" stroke-width="7" stroke-linecap="round"/>
  <line x1="474" y1="340" x2="470" y2="322" stroke="#455a64" stroke-width="5" stroke-linecap="round"/>
  <path d="M458,322 L482,320 Q494,320 491,334" fill="none" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
  <!-- Basket with fish -->
  <path d="M492,332 L532,332 L526,362 L498,362 Z" fill="#c8894a" stroke="#8d5524" stroke-width="2"/>
  <path d="M495,342 L529,342 M497,352 L527,352" stroke="#8d5524" stroke-width="1.5"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 512 330;8 512 330;-8 512 330" dur="0.8s" repeatCount="indefinite"/>
    <path d="M504,334 Q512,312 520,334 Z" fill="#4fc3f7" stroke="#0277bd" stroke-width="1.5"/>
    <path d="M512,318 L505,306 L519,306 Z" fill="#4fc3f7" stroke="#0277bd" stroke-width="1.5"/>
  </g>

  <!-- Crank & chainring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 395 440" to="360 395 440" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="395" cy="440" r="16" fill="#b0bec5" stroke="#455a64" stroke-width="3" stroke-dasharray="4 3"/>
    <line x1="367" y1="440" x2="423" y2="440" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="395" cy="440" r="5" fill="#263238"/>
  </g>

  <!-- Near leg (A) -->
  <polyline fill="none" stroke="#ff9800" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="372,392 411.9,395.6 423,434">
    <animate attributeName="points" dur="1.6s" repeatCount="indefinite" values="372,392 411.9,395.6 423,434;372,392 407.9,409.6 419.3,448;372,392 401.6,419 409,458.3;372,392 398.3,422.1 395,462;372,392 398.3,422.2 381,458.3;372,392 399.9,420.6 370.8,448;372,392 403.2,417 367,434;372,392 408.8,407.7 370.8,420;372,392 411.1,383.4 381,409.8;372,392 403.1,366.8 395,406;372,392 405.4,369.9 409,409.8;372,392 410.5,381 419.3,420;372,392 411.9,395.6 423,434"/>
  </polyline>
  <g transform="translate(423,440)">
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" values="423,440;419.25,454;409,464.25;395,468;381,464.25;370.75,454;367,440;370.75,426;381,415.75;395,412;409,415.75;419.25,426;423,440"/>
    <rect x="-9" y="-1" width="18" height="5" rx="2" fill="#263238"/>
    <path d="M-5,-7 L15,-4 L17,1 L-6,1 Z" fill="#ff9800" stroke="#e65100" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M1,-5 L4,1 M8,-4 L10,1" stroke="#e65100" stroke-width="1.2"/>
  </g>

  <!-- Pelican upper body (gentle bob) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.8s" repeatCount="indefinite"/>

    <!-- Far wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 385 312;-6 385 312;4 385 312" dur="1.6s" repeatCount="indefinite"/>
      <path d="M392,315 C372,270 350,238 318,214 C326,230 318,232 330,244 C320,248 330,256 338,262 C332,268 342,274 352,276 C360,292 372,306 392,330 Z" fill="#e3e9ec" stroke="#b0bec5" stroke-width="2"/>
      <path d="M318,214 C326,230 318,232 330,244 C320,248 330,256 338,262 L346,250 C336,236 328,226 318,214 Z" fill="#455a64"/>
    </g>

    <!-- Tail -->
    <path d="M324,334 L292,322 L302,340 L290,354 L326,356 Z" fill="#f5f5f5" stroke="#cfd8dc" stroke-width="2" stroke-linejoin="round"/>
    <!-- Body -->
    <ellipse cx="375" cy="346" rx="58" ry="48" fill="#ffffff" stroke="#cfd8dc" stroke-width="3"/>
    <ellipse cx="392" cy="366" rx="32" ry="22" fill="#fff3e0" opacity="0.8"/>

    <!-- Near wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 392 322;8 392 322;-3 392 322" dur="1.6s" repeatCount="indefinite"/>
      <path d="M398,320 C362,292 326,272 282,262 C296,274 288,280 302,286 C292,292 300,298 312,300 C306,308 318,312 330,312 C352,326 372,340 398,346 Z" fill="#ffffff" stroke="#b0bec5" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M282,262 C296,274 288,280 302,286 C292,292 300,298 312,300 L322,290 C308,278 298,270 282,262 Z" fill="#37474f"/>
      <path d="M340,300 Q360,310 380,322" fill="none" stroke="#cfd8dc" stroke-width="2"/>
    </g>

    <!-- Neck & head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 415 320;-3 415 320;0 415 320" dur="1.6s" repeatCount="indefinite"/>
      <path d="M408,330 C432,310 420,282 442,258" fill="none" stroke="#cfd8dc" stroke-width="27" stroke-linecap="round"/>
      <path d="M408,330 C432,310 420,282 442,258" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
      <circle cx="446" cy="246" r="24" fill="#ffffff" stroke="#cfd8dc" stroke-width="2.5"/>
      <path d="M432,226 Q428,210 440,214 Q438,204 450,212 Q452,220 446,224 Z" fill="#fff59d"/>
      <!-- Pouch -->
      <path d="M461,252 Q510,258 556,262 Q524,292 484,284 Q464,277 461,252 Z" fill="#ffcc80" stroke="#ef6c00" stroke-width="2"/>
      <!-- Upper bill -->
      <path d="M458,236 Q510,238 560,256 Q567,263 556,263 Q510,256 461,254 Z" fill="#ff9800" stroke="#e65100" stroke-width="2" stroke-linejoin="round"/>
      <path d="M556,256 Q566,258 562,266 Q558,262 552,262 Z" fill="#e53935"/>
      <!-- Eye -->
      <circle cx="453" cy="238" r="5" fill="#212121"/>
      <circle cx="455" cy="236" r="1.8" fill="#fff"/>
      <ellipse cx="444" cy="254" rx="6" ry="3.5" fill="#f8bbd0" opacity="0.8"/>
    </g>
  </g>

  <!-- Foreground grass tufts -->
  <g fill="#4e8a26">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.68s" repeatCount="indefinite"/>
    <path d="M20,570 L28,548 L34,570 L42,552 L46,570 Z"/>
    <path d="M110,590 L116,572 L122,590 L130,574 L134,590 Z"/>
    <path d="M180,570 L188,548 L194,570 L202,552 L206,570 Z"/>
    <path d="M270,590 L276,572 L282,590 L290,574 L294,590 Z"/>
    <path d="M340,570 L348,548 L354,570 L362,552 L366,570 Z"/>
    <path d="M430,590 L436,572 L442,590 L450,574 L454,590 Z"/>
    <path d="M500,570 L508,548 L514,570 L522,552 L526,570 Z"/>
    <path d="M590,590 L596,572 L602,590 L610,574 L614,590 Z"/>
    <path d="M660,570 L668,548 L674,570 L682,552 L686,570 Z"/>
    <path d="M750,590 L756,572 L762,590 L770,574 L774,590 Z"/>
    <path d="M820,570 L828,548 L834,570 L842,552 L846,570 Z"/>
    <path d="M910,590 L916,572 L922,590 L930,574 L934,590 Z"/>
    <circle cx="70" cy="560" r="4" fill="#ffeb3b"/>
    <circle cx="230" cy="560" r="4" fill="#ff80ab"/>
    <circle cx="390" cy="560" r="4" fill="#ffeb3b"/>
    <circle cx="550" cy="560" r="4" fill="#ff80ab"/>
    <circle cx="710" cy="560" r="4" fill="#ffeb3b"/>
    <circle cx="870" cy="560" r="4" fill="#ff80ab"/>
  </g>

  <!-- Verification code -->
  <rect x="664" y="554" width="124" height="34" rx="9" fill="#ffffff" opacity="0.85"/>
  <text x="726" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c" letter-spacing="2">RBPKKA</text>
</svg>
