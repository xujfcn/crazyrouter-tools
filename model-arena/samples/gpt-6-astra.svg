            <path d="M4-3 10 4M13-2 17 5" stroke="#DB8030" stroke-width="2" stroke-linecap="round"/>
            <path d="M-14 10H28" stroke="#284F54" stroke-width="6" stroke-linecap="round"/>
            <path d="M-8 9H20" stroke="#88B9AA" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- 前景草丛与花朵 -->
  <g fill="none" stroke="#539A69" stroke-width="4" stroke-linecap="round">
    <path d="M41 453 35 421M41 453 52 429M36 449 23 436M99 451 104 420M101 444 114 433"/>
    <path d="M830 589 820 563M832 589 841 555M839 590 854 573M176 603 164 582M177 603 184 575"/>
  </g>
  <g stroke="#748C4B" stroke-width="3" stroke-linecap="round">
    <path d="M64 445V401M79 447V392"/>
    <path d="M64 416V396M79 408V387" stroke="#A57443" stroke-width="7"/>
  </g>
  <use href="#flower" transform="translate(73 592) rotate(-12)"/>
  <use href="#flower" transform="translate(112 606) rotate(14) scale(.8)"/>
  <use href="#flower" transform="translate(789 599) rotate(9)"/>
  <use href="#flower" transform="translate(877 565) rotate(-12) scale(.8)"/>
  <g fill="#F6F2BB">
    <ellipse cx="236" cy="600" rx="5" ry="3"/>
    <ellipse cx="250" cy="589" rx="3" ry="2"/>
    <ellipse cx="695" cy="608" rx="4" ry="2"/>
  </g>
  <g transform="translate(209 391)">
    <animateTransform attributeName="transform" type="translate" values="209 391;215 382;224 389;209 391" dur="5.6s" repeatCount="indefinite"/>
    <path d="M0 0Q-16-18-19-5Q-16 7 0 3Q10-18 16-8Q21 3 0 3" fill="#FFCC57"/>
    <path d="M0-1 1 7" stroke="#6D805A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 可见校验码 -->
  <rect x="820" y="594" width="119" height="29" rx="14.5" fill="#FFF7DD" opacity=".94"/>
  <text x="879.5" y="614" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#315F5A">RBPKKA</text>
</svg>
